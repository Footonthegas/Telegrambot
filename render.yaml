services:
  - type: web
    name: attendance-bot
    env: docker
    plan: free
    region: oregon
    branch: main
    startCommand: python telegram_bot.py
    envVars:
      - key: SELENIUM_HEADLESS
        value: "1"
      - key: FAST_MODE
        value: "1"
      - key: ENABLE_HTTP_FAST_PATH
        value: "1"
      - key: PAGE_LOAD_STRATEGY
        value: eager
      - key: CHROMEDRIVER_PATH
        value: /usr/bin/chromedriver
      - key: BACKEND_SERVER_HOST
        value: "0.0.0.0"
      - key: BACKEND_SERVER_PORT
        value: "10000"
      - key: PORT
        value: "10000"
      - key: BACKEND_PUBLIC_BASE_URL
        value: https://attendance-bot-ng7k.onrender.com
    healthCheckPath: /health